 FKN_oktoberfest_desc:0 ""
 EOM_invite_orthodox_settlers_title:0 "Invite Orthodox Settlers"
 EOM_invite_orthodox_settlers_desc:0 ""
 Z43_rebuild_troy_title:0 "Restore Troy"
 Z43_rebuild_troy_desc:0 "Now that we have stabilised our country, we should make sure to do our ancestors proud and rebuild Troy once again. This time, we will make sure to never lose it again."
 Z43_oracles_title:0 "Consult the Oracles"
 Z43_oracles_desc:0 "Long ago, Cassandra tried to warn us of what would happen if we brought a wooden horse into our city; sadly, she was cursed to be never believed. This time, we are better prepared. Let us ask God, instead of Apollo, for what the future of this war may hold."
 Z43_orthodox_title:0 "Steady Our Faith"
 Z43_orthodox_desc:0 "We have been conquered by Christians from the west and heathens from the east before, yet we have always managed to stay true to our beliefs. In this new era of printers and religious reformation, we should make more propaganda and try harder to ensure that no one thinks otherwise, and with a bit of luck, maybe we can even convince others of our faith."
