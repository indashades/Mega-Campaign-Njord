 trade_confederation_reform:0 "Hansa Trade Confederation"
 trade_confederation_reform_desc:0 "The loose collective of Hansa Cities has united together in a Trade Confederation. Though officially an alliance between the various Hansa cities and its merchants and guilds, the Confederation follow a common goal of increased commerce, expansion of trade routes, and the development of further economic activity. With this, laws and regulations bind the Hansa together in a network of codes of practice with the Hanseting, the federal courts- and commerce-office, serving as a parliamentary order where the Hansa members can voice their concerns and vote on important matters."

 frankonian_kingdom:0 "Franconian Kingdom"
 frankonian_kingdom_desc:0 "The old Duchy of Franconia has been united, claiming the title of Electorate of the Holy Roman Empire. With the lands duchies of Bavaria and Franconia united under a single ruler, our destiny lies in confederating all of southern Germany."

