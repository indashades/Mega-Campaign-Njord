 #Events:
 MEGA_events.1.t:0 "Peasants and Burghers Revolt"
 MEGA_events.1.d:0 "The Regency of Widukind II Fróilaz-Traba, a foreign prince from Galicia, has since the passing of the late Prince Widukind I sparked much controversy. With ever-increasing taxes and tariffs on the peasantry and burgher guilds, most notably on the selling of fish, grain and salt, it seems that a breaking point has been reached. With thousands of armed peasants rising up against the forces of the Duchy in Ditmarschen, Lauenburg and Bremen, the Burgher Guilds in Hamburg and Lübeck have themselves banded together with foreign mercenaries, storming the royal palace and taking Widukind II prisoner. The members of the Regency, choosing their lives over action against the instability, has fled across the Danish straits into Sjaelland. \n \nWith the peasantry and burgher guilds now de-facto in power. The various leaders of the guilds and peasant bands have agreed to meet in Hamburg to decide the future of Holstein and the Electorate-Duchy."
 MEGA_events.1.a:0 "Long live the Republic!"

 MEGA_events.2.t:0 "If you see this event then somethings wrong"
 MEGA_events.2.d:0 "Kill yourself"
 MEGA_events.2.a:0 "Ok"

 MEGA_events.3.t:0 "Proclamation of the Hanseatic League"
 MEGA_events.3.d:0 "With the toppling of the Nobles, the ousting of the Regency of Widukind II, and Widukind himself stripped of his princely titles and placed in house arrest, the representatives from various peasant bands, burgher guilds and the Hansa merchants met today in Hamburg to decide the future of the Electorate-Duchy. The results of these discussions has placed the peasantry firmly as a Fourth Estate, with many privileges granted and secured. The Burgher Guilds have also been granted much autonomy within the cities, with tariffs and taxes revoked to ensure their economic freedom. The Hansa merchants, however, have seemingly come out on top of these discussions, with a 'Hansa-led Oligopoly' under the rule of Aedelbrecht von Hassel, one of the last members of the von Hassel dynastic family that used to rule the lands. A message has been sent to the Emperor of the Holy Roman Empire promising to continue the Electorate-Duchy, now an Electorate-Republic, as a strong continuing member of the Empire."
 MEGA_events.3.a:0 "Long live the Electorate-Republic! Long live the Hanseatic League!"

 MEGA_events.5.t:0 "Ascension of the Great Khan"
 MEGA_events.5.d:0 "The Mongol Empire, still sprawing across Eurasia, has so far been held together by the iron will and fearsome rule of the Khan. Total subjugation of the tribal leaders and tributary states are enforced by the feared cavalry hordes of the Khan. But with the recent passing of the aging Great Khan Khubilai, an emergency kurultai has elevated his youngest son- an accomplished but ruthless general- to the 'Skull Throne'. Always lacking his father's patience for compromise, the new Khan has embarked on a rule through total terror, ordering the immediate execution of prominent leaders suspected of disloyalty. \n \nThese purgers has fractured the fragile balance of power. Steppe clans now mobilize their hosts and there are talks of revolts and frontiers governors declaring autonomy. The Mongol Empire seemingly exits its previous harmonious stability, and enters into a violent struggle of survival."
 MEGA_events.5.a:0 "By blood we rule, by blood we fall."

 MEGA_events.6.t:0 "Rebellions in the Mongol Empire"
 MEGA_events.6.d:0 "Several pressures has turned the newly appointed Great Khan's recent purges into a catalyst for empire-wide unrest rather than a show of strength. The old power balance between Mongol elites and its Tatar, Khitan, Oghuz and other subjects has finally eroded into outright hatred. Generations of settled rule have tied the empire's economy to cities, guilds and agricultural taxes rather than plunder. Persian, Chinese and Turkic administrators and nobles wield increasing influence across the Empire's territories, who often play the rival Mongol clans against one another. Provincial governors, more keen on keeping their economic and political influences have begun declaring independence to protect their own interest rather than swearing fealty to a violent Great Khan. \n \nWith these mounting troubles, neighbouring states- long contained by Mongol dominance- sense weakness and have stopped paying their yearly tributes, quietly supporting revolts with arms, gold and advisors. Border regions facing both internal instability and foreign threats, choose self-rule as a matter of survival."
 MEGA_events.6.a:0 "The authority of the Great Khan is fragmenting."

 MEGA_events.7.t:0 "Proclamation of the Greater Usun Mongols"
 MEGA_events.7.d:0 "Sparked by the Great Khan's purges, the uprising of the Usun Mongols, a powerful and ancient tribe rooted in western Mongolia, has proven the weakness of the new Khan's authority. The Usun Mongols has managed to rally many disaffected clans across the Mongol heartland, uniting into the Greater Usun Mongol Federation. Led by a rival kurultai near the sacred grazing lands of the Altai frontier, the Greater Usun Mongols has attracted many smaller tribes, fearful of further purges, which has strengthened their numbers considerably. \n \nThe declaration has sent shockwaves throughout the Empire. For the first time, a major Mongol power has openly challenged the authority of the Great Khan and the Mongol Empire as a whole. Other autonomous regions watch closely, carefully studying and planning their own destinys independent of the Great Khan's illegitimate rule."

 MEGA_events.8.t:0 "Troubles in the Eastern Territories"
 MEGA_events.8.d:0 "In the eastern territories of the empire, the Chahar- long one of the most influential Mongol tribes- move swiftly as the empire continues to fracture. Long-standing rivals of the Oirats, who remain only semi-loyal to the Great Khan, the Chahar see an opportunity to break free from both control of the Great Khan and the influence of the Oirats. The leader of the Chahar horde assert that the eastern steppe must be ruled by a Khan who can command loyalty through strength and tradition, not fear. With this, the Chahar has elevated its own Khan, claiming the mandate to preserve order in the east. \n \nThe Oirats, still nominally loyal to the Great Khan, has openly declared the Chahar proclamation as an insurrection against the Khan. Skirmishes has erupted along the eastern frontier as Khan-backed forces clash with the Chahar cavalry."
 MEGA_events.8.a:0 "The Great Khan is grasping for legitimacy."

 MEGA_events.9.t:0 "The Cumans and the City of Sarai"
 MEGA_events.9.d:0 "A similar unraveling has now gripped the Empire's western borders. There, the Cumans, long-subjugated steppe warriors and experienced frontier auxiliaries of the Mongol Empire have risen up in open revolt against the Khan. Exploiting the chaos of civil war and the absence of the Khan's armies, they have managed to seize Sarai, the great city that used to serve as the western capital of the Mongol Empire and a symbol of its dominon over the Volga Steppe. The fall of Sarai is a devastating blow. Cut off from reinforcements and facing coordinated Cuman uprisings, the Great Khan has abandoned the west entirely, fleeing eastward into Central Asia to preserve what remains of his authority. Imperial administrators and loyal nobles scatter, while the Cumans proclaim the city liberated from Mongol rule, positioning themselves as masters of the western steppe and the Volga river. \n \nYet Mongol power in the west has not vanished completely. In the aftermath of Sarai’s capture, scattered Khan-loyal tribes, veteran generals, and remnants of imperial tumens rally together. From this desperate coalition emerges the Great Horde— a mobile, hard-hitting cavalry army bound not by territory, but by loyalty to the idea of the Khaganate itself. Their mission is singular and uncompromising: the recapture of Sarai and the restoration of order in the west. Raiding Cuman supply lines and crushing smaller rebel forces, the Great Horde has taken it upon themselves to rule the western territories and the Volga Steppe in the absence of the Great Khan. \n \nAs the Great Horde rides west to meet the Cuman forces -the Empire itself has split into civil war and anarchy."
 MEGA_events.9.a:0 "The Age of the Mongols has ended."

 MEGA_events.10.t:0 "The Collapse of the Mongols"
 MEGA_events.10.d:0 "The Great Khan, now barely ruling from Central Asia, commands loyalty in name only, his authority drowned out by constant war and betrayal. As the Chahar and Oirats duke it out in the east, the Great Horde and Cumans fight for the legendary city of Sarai. As cities burn, and the roads that once bound the Mongol Empire and Eurasia are left absent of trade, with only the occasional marching of cavalry hordes, the Mongol armies turn on another, fighting not for empire but for their own survival. By the mid 1400's, the Mongol Empire exists only in memory and as a chapter in future history books."
 MEGA_events.10.a:0 "The greatest empire the world has known is no longer."

 MEGA_events.11.t:0 "Reformation Threatening the Empire"
 MEGA_events.11.d:0 "The Holy Roman Empire had been relatively accepting of the various religious differences of its member states, with Hussite, Orthodox, Blood-Christians often being allowed to practice their heretical beliefs in peace without much interference from the Catholic Church. This tolerance even went so far as to allow a Pagan Norse Electorate to rule within the Empire. However, with the Reformation raging across the Empire, religious tolerance is at an all-time low. As fellow Christians and Pagans turn against each other, an emergency Diet in the capital of the Empire has been enacted. Here, the Electors and the few Free Cities still left have gathered to discuss the future of the Holy Roman Empire."
 MEGA_events.11.a:0 "We must have a diplomatic course to ensure stability!"
 MEGA_every_hre_country_gains_TT:0 "Every member of the Holy Roman Empire will gain:"


 MEGA_events.12.t:0 "The Emergency Diet"
 MEGA_events.12.d:0 "The emergency Diet invoked only a few months ago has reached the end of its discussions. After much debate, everyone agreed that more executive powers must be relegated to the Emperor in order to ensure the stability of the Empire at large. Now all that there is left to do is for the Emperor to decide on the religious direction of the Holy Roman Empire."
 MEGA_events.12.a:0 "I will need much time to think about this..."
 
 MEGA_events.13.t:0 "The future of the Holy Roman Empire"
 MEGA_events.13.d:0 "After the emergency Diet was finished, the Emperor has spent much time discussing and debating with his fellow Electors and the Imperial Court."
 MEGA_events.13.a:0 "Tolerance is the only way forward."
 MEGA_events.13.b:0 "Enforced Catholic Doctrine will create unity."

 MEGA_events.14.t:0 "Last Crusade"
 MEGA_events.14.d:0 "With the loss of the Crusader States of Antioch and Aleppo, only Jerusalem remains, the bastion of Catholicism in the Levant. With the ever-growing influence and power of the Ayyubids, the Knights of Jerusalem has with the approval of the Pope proclaimed a Crusade against the Ayyubid Imamate, hoping to reclaim its previous territories in Aleppo, Lebanon and Antioch. Will this be the last ride of the Knights of Jerusalem, or is this merely the revival of the Crusades from long ago?"
 MEGA_events.14.a:0 "Deus Vult!"

 MEGA_events.15.t:0 "Jerusalem Asks For Aid"
 MEGA_events.15.d:0 "With the Crusade against the Ayyubids raging, several diplomats from Jerusalem has arrived asking for our donation to their cause."
 MEGA_events.15.a:0 "These Crusaders are a dead cause."
 MEGA_events.15.b:0 "Of course, give them what they ask."
 MEGA_events.15.c:0 "Aid is simply not enough, we shall march together!"

 MEGA_events.16.t:0 "Expansion of Marienberg"
 MEGA_events.16.d:0 "The Great Würzburg Fortress, better known by the locals as Marienberg Fortress, rises above the city of Würzburg on the Main river and ranks among the most important fortress complexes of medieval Germany. Its origins rach back to the early Middle Ages, when a Frankish stronhold and church stood on the hill, long before Würzburg became a major center of power in Franconia. \n \nFrom the 12th century onward, Marienberg developed into the fortified residence of the Prince-Bishops of Würzburg. Massive gates and early forms of cannons lined the walls of the great fortress. Throughout wars, revolts, and shifting imperial politics, the fortress stood as a symbol of authority and defense. Today, it remains a powerful monument to Würzburg's strategic and political importance within the Holy Roman Empire."
 MEGA_events.16.a:0 "A testament to our authority as Emperors of Germany!"

 MEGA_events.17.t:0 "The Diet of 1512"
 MEGA_events.17.d:0 "The Diet of 1512, hosted in the city of Trier, marked a quiet but decisive turning point for the Holy Roman Empire. Alarmed by mounting legal chaos and the widening gulf between Imperial law and territorial practice, the princes and imperial cities agreed to a sweeping reform of the Hofgericht. For the first time, judges were appointed by mixed estates rather being strictly noble or by imperial favor, and standardized procedures were imposed across the Imperial Circles. Justice, though still slow, became more predictable— and this predictability itself created more trust in the Imperial Law. \n \nThese reforms had consequences beyond the courtroom. As Martin Luther’s ideas began to circulate, the reformed judicial system offered channels for appeal and arbitration that had not previously existed. Religious disputes, instead of immediately hardening into armed confrontations, were often dragged—grudgingly—before imperial courts. While verdicts rarely satisfied all parties, the very act of legal engagement delayed violence and fostered a fragile habit of compromise. \n \nThe stability did not last forever. By the 1530s, confessional divisions again outpaced imperial institutions. Yet, the Diet of 1512 was a rare moment when reformist ambition overcame inertia. For a single generation, law tempered faith, and the Empire so often mocked as neither holy, Roman, nor an empire—proved itself capable of adaptation to new challenges."
 MEGA_events.17.a:0 "Institute these reforms across the Empire."

 MEGA_events.18.t:0 "Expansion of the Hansa League"
 MEGA_events.18.d:0 "By the middle of the sixteenth century, the Confederation of Hansa Cities had come to dominate the trade in the North- and Baltic Sea. Lübeck, Hamburg, and Bremen bound the lesser ports to them through unified tariffs, shared naval patrols, and a common commercial court that settled disputes faster than any imperial court. The Hanseatic merchants became the quiet architects of northern prosperity. Grain flowing from Poland and Russia, fish and timber from Scandinavia, and wool and cloth from England and the Low Countries flowed through their counting houses, while silver and finished goods moved east and south into the Holy Roman Empire. Imperial cities along the Elbe, Weser, and Rhine grew fat on transit tolls and warehouse fees, and even distant princes learned that peace along trade routes was more profitable than war. \n \nThis mercantile dominance reshaped politics as well as markets. Kings and Dukes, increasingly dependent on Hansa loans and logistics, granted the League sweeping privileges in exchange for stability and revenue. Though the Empire remained divided in faith and law, Hansa trade stitched it together with contracts, credit, and cargo holds. In an era of religious turmoil, it was commerce— carried on cog and carrack— that gave northern Europe a rare and enduring prosperity."
 MEGA_events.18.a:0 "With money we can do more than buy, we can build!"

 MEGA_events.19.t:0 "The Free-City of Geneva"
 MEGA_events.19.d:0 "In the tumultuous 1510s, as dukes and bishops contested souls and borders alike, the city of Geneva chose a quieter revolution. Rather than fall fully into the orbit of Savoy or stand alone against its neighbors, the city’s councils proclaimed the Republic of Free Geneva, a self-governing commune that swore fealty directly to the Holy Roman Emperor. Imperial banners were raised beside the Rhône, not as symbols of domination, but of protection. The arrangement was novel. Geneva governed itself through elected magistrates and guild councils, while imperial authority was expressed only through law and defense. An Imperial Free City in all but name, Geneva became a refuge for merchants, printers, and reformers who trusted the Emperor’s distant hand more than a nearby prince’s grasp. Its presses churned out legal codes and theological tracts alike, carefully framed to avoid charges of sedition under imperial law. \n \nThis balance brought unexpected stability. Imperial recognition deterred Savoyard ambitions, while Geneva’s loyalty gave the Empire a foothold in the western Alps. Though independence remained contested outside its walls, disputes were argued in councils rather than settled by arms. By century’s end, Free Geneva stood as a small but striking example of how republican governance and imperial allegiance could coexist— an anomaly in an age otherwise defined by crowns and confessions."
 MEGA_events.19.a:0 "The Republic can continue, but under our rule."
 MEGA_events.19.b:0 "Recognise the independence of the Free City."

 MEGA_events.20.t:0 "The Fading of the Geats"
 MEGA_events.20.d:0 "The Geats and Swedes, two culturally distinct cultures that had been established since the first Jarldoms. One of them, the Swedes, became the most influential of them, forming the basis of what would become the Swedish Kingdom. As the Geats took second place in all regards in comparison to the Swedes, so would the modern age eventually erode the distinction between the cultures. Linguistical differences diminished as Swedish became the language of governance, trade, law, and religious institutions. Intermarriage and mobility accelerated the process, with Geatish surnames being replaced by Swedish. As time went on, the term 'Geat' started to dissapear from official usage."
 MEGA_events.20.a:0 "It is time we fully convert our Geatish brethren."
 MEGA_events.20.b:0 "We should spend some effort to preserve the Geats"

 MEGA_events.21.t:0 "The Diet of 1596"
 MEGA_events.21.d:0 "As fewer and fewer duchies and kingdoms are left standing, with the strongest electors and titles incorporating their lesser, so too does the Holy Roman Empire consolidate. This consolidation has concentrated power further in the Electors, who have grown their influence to rival the power of the Emperor himself, but it has also smoothed out the bureaucracy of the Empire. With fewer Free Cities, independent cities and smaller towns, duchies and kingdoms, there are now fewer entities that the Hofgericht must interact with. Combine this with the various constituencies of the Holy Roman Empire employing their own respective courts, town halls, and administrative structures, few still rely on the help of the Holy Roman Empire and its bureaucratic processes to maintain order and law. \n \nThe Empire is on the path of centralisation, though still not fully unified, and is further strengthened."
 MEGA_events.21.a:0 "The path to Modernisation of the Empire is clear."

 MEGA_events.22.t:0 "The Diet of 1532"
 MEGA_events.22.d:0 "By the third decade of the sixteenth century, the Holy Roman Empire discovered that doctrine, once loosed, could not be recalled by edict alone. The Reformation had ceased to be a matter of pulpits and pamphlets and had instead lodged itself in chancelleries, courts, and tax rolls. Imperial officials, long trained to write in nomine Dei with an unspoken assumption of Rome, now faced petitions signed by Lutheran councils, Reformed guilds, and cities that no longer recognized episcopal authority at all. \n \nAt first, the imperial bureaucracy resisted. Decrees were issued reaffirming Catholic orthodoxy as the sole legal faith of the Empire, and magistrates were instructed to ignore appeals made in the name of “new teachings.” Yet enforcement proved impossible. Tax collectors found entire districts refusing payment unless their pastors were recognized as lawful clergy and City courts refused to swear oaths invoking saints they no longer acknowledged. Ultimately, pragmatism forced change. In 1532, the Reichshofrat accepted its first case argued by a Protestant jurist, who cited Scripture rather than canon law. Soon afterward, imperial formularies were amended: oaths could be sworn “before God Almighty” without further specification, marriage contracts no longer required episcopal blessing, and clerical status was redefined in secular terms. \n \nBy the mid-century, the civil law of the Empire had become confessionally neutral by necessity with Catholics, Lutherans and Reformed Christians stood equal before the imperial courts, bound by the same taxes and protections. Theologians protested, but the ledgers were clear: the Empire endured not because it resolved the truth of faith, but because its bureaucracy learned to live without answering that question at all."
 MEGA_events.22.a:0 "May this bring reformism to the Empire at large!"

 MEGA_events.26.t:0 "The Great Chairman"
 MEGA_events.26.d:0 "Our glorious rebellion against the Chinese Emperors did not turn out as succesfully as we had hoped. Massive losses in land and thousands of our martyred comrades falling in battle, bankruptcy and the failure to realise the Revolution has brought our nation to ruin. However, as if heaven itself sent us a gift, a peasant-leader known only as the 'Chairman' has arrived to our last holdouts today. With him he brings thousands of his men, great knowledge in governance and protracted people's war, and technologies."
 MEGA_events.25.a:0 "Praise the Chairman! Praise the developers!"

 MEGA_events.27.t:0 "Szekler Generals"
 MEGA_events.27.d:0 "Created by the Unio Trium Nationum in 1438, a union between the Transylvanian estates of Hungarian nobles, Saxon merchants and other German lesser nobles, as well as the Szekler free military, the elite armoured cavalry guard of the 'Hussars' have earned its fame as the preeminent guard of the eastern realms of the Empire. Regularly drilled, highly disciplined, and devout in their mission to protect Christianity and the Hungarian Kingdoms, the Hussars have served us very well. Amongst their ranks, many famed officers have come to our court in order to further serve the King-Elector."
 MEGA_events.27.a:0 "A highly skilled Captain will serve us well!"
 MEGA_events.27.b:0 "Employing them directly as a General will serve us the best!"

 MEGA_events.28.t:0 "Oh no!"
 MEGA_events.28.d:0 "We have gotten a revol oh nooooo!"
 MEGA_events.28.a:0 "I guess we can ask Transcarpathia for help?"

 MEGA_events.29.t:0 "Revolts in Moesia"
 MEGA_events.29.d:0 "To our southern border, across the Carpathian mountains lies the Princedom of Moesia. News has reached us that the nobles in their lands, fed up with excessive taxes and privileges being revoked, have risen up against the Vojvode. Now, diplomats from the Princedom has come asking us for help in putting down the noble revolt. In return, they pledge their loyalty to us as a vassal state."
 MEGA_events.29.a:0 "Of course we shall aid them!"
 MEGA_events.29.b:0 "And risk angering the Byzantine Empire? No chance!"

 MEGA_events.30.t:0 "The Mountain Wall of Fellegvár"
 MEGA_events.30.d:0 "In the high Carpathians, where the Elector-Kingdom of Transcarpathia meets the Moldavian Principality, rises the mountain wall of Fellegvár. First raised in the waning centuries of Roman dominion, the fortification was later restored and expandd upon by the Transylvanian Kingdom. Standing as the Holy Roman Empire's easternmost bulwark, Fellegvár has guarded the entrance into Transylvania with stubborn resolve. Its stone ramparts broke the momentum of the Mongol onslaught and, in later generations, repelled the Cuman Hordes, preserving the imperial frontier."
 MEGA_events.30.a:0 "The Eastern Bulwark of the Empire stands tall."

 MEGA_events.31.t:0 "Hunyad and Lord Corvin"
 MEGA_events.31.d:0 "In the southern reaches of Transcarpathia lies the province of Hunyad, ancestral seat of the Hunyadi dynasty, from which the kingdom's rulers draw their name and authority. There stands the Castle-House of the late Lord Corvin, whose castle walls and mountain towers have long safeguarded royal prestige and now shelter the administrative court of Elector-Kings of Transcarpathia. Within its halls, the machinery of rule has taken root, and with it a growing question that divides the royal council: whether the king should abandon Maramaros and raise Hunyad not only as the seat of governance, but as the capital of the realm itself."
 MEGA_events.31.a:0 "Hunyad should serve as our capital."
 MEGA_events.31.b:0 "Maramaros serves us well enough."

 MEGA_events.32.t:0 "Proclamation of the Vijayanagars"
 MEGA_events.32.d:0 "Having conquered much of the southern indian continent, the Hiremaths have now formally united into the Vijayanagar Kingdom, laying claim to all of southern India."

 MEGA_events.33.t:0 "Legacy of Mátyás"
 MEGA_events.33.d:0 "King Mátýas, legendary king who managed to unite much of Hungary in the prestigious Kingdom of Hungary was not only an astute statesman, governor and reformer of the Hungarian army, under his rule there was great developments in science, arts, and culture. Hungary was one of the first areas outside of Italy to embrace the Renaissaince, and we must strive to continue this effort with the ever-changing world."
 MEGA_events.33.a:0 "Hungary must be the center of European arts and sciences."

 MEGA_events.34.t:0 "Arrival of the Hansa"
 MEGA_events.34.d:0 "With the expansion of the german Confederation of Hansa Cities, famed merchants have established trade routes all along the Baltic Sea and has slowly cemented their control over the North Sea trade. Now, the Hansa are looking to expand their trade into Scotland and Ireland, looking to buy irish and scottish wool. Inviting these merchants to our ports means letting their commercial enterprises to set up in our ports to sell their goods."
 MEGA_events.34.a:0 "Our friendship is strengthened through trade"
 MEGA_events.34.b:0 "We can't trust those dirty merchants"

 MEGA_events.35.t:0 "The Chairman Seizen Qin"
 MEGA_events.35.d:0 "In his most recent bravadous achievements, the 'Great Chairman' took his 2nd Northern Expeditionary Army into the contested territories of the Qin Anarchist Commune. Quickly overrunning their defensive lines, the seat of power and capital of Qin was sieged for several days before the declaration of surrender. \n \nNow, the path to Shun lies open."
 MEGA_events.35.a:0 "Anarchist scum!"

 MEGA_events.36.t:0 "Shun Submits"
 MEGA_events.36.d:0 "Because of our historical friendship with the Tribal territories of Shun, an accord was struck with the Paramount Chief and the 'Great Chairman', allowing our peasant armies to integrate the Shun territories. \n \nThe path to righteous National Liberation is clear."
 MEGA_events.36.a:0 "United in revolutionary fervor!"

 MEGA_events.37.t:0 "The Second Northern Expedition"
 MEGA_events.37.d:0 "With our recent consolidation of Shanxi, it is ample time to finish our northern conquests with our invasion of the Korchin Horde. Though a much larger adversary, the 'Great Chairman' assures us that the Korchin tribes are weak and disunited internally. We must strike now!"
 MEGA_events.37.a:0 "The Northern Expedition Resumes!"
 
 MEGA_events.38.t:0 "The Second Northern Expedition Continues"
 MEGA_events.38.d:0 "With our recent conquests in Northern China and the surrounding areas in Beijing, several autonomous regions in Henan and Shandong have ceeded to the Chinese Communists and the Northern Expeditionary Army, greatly increasing our control over Northern China as a whole."
 MEGA_events.38.a:0 "Wansui!"

 MEGA_events.39.t:0 "The Council of Ulm"
 MEGA_events.39.d:0 "With the outbreak of the Reformation having raged across the Holy Roman Empire, shaking its foundations to its very core, for the better part of 40 years now, a slow quiet as subsided over the heated religious wars that plagued Germany in particular. Now, in the famous city of Ulm, several representatives from Catholics, Protestants, Reformists, the Orthodox Church and even a handful of Hussite remnants, has met to discuss the future of the 'Reformation'. With tolerance and cross-church understanding returning, now is the time for diplomacy. The members of the Council of Ulm did not reach a decisive agreement on the future of the Holy Roman Empire or the Christian Church in Europe as a whole, but all parties left the Council with newfound amicable relations."
 MEGA_events.39.a:0 "Perhaps there is finally time for some reforms..."

 MEGA_events.6767.t:0 "Clashing Claims"
 MEGA_events.6767.d:0 "Centuries of intermarriage has opened up mutual claims between the thrones of Byzantium and Troy. Will there be another Trojan war like in the myths?"
 MEGA_events.6767.a:0 "Shieeeeeee"
 MEGA_events.6768.t:0 "Siege of Troy"
 MEGA_events.6768.d:0 "Somehow, we can’t seem to stop repeating the Iliad. Troy is under siege. Again. Just like the Iliad said, though, we will keep fighting. So let us band together and fight until we can no longer!"
 MEGA_events.6768.a:0 "The war isn’t over yet!"
 MEGA_events.6769.t:0 "The Sack of Troy"
 MEGA_events.6769.d:0 "Once again, our city has fallen. We will not go out without a literal blaze of glory though. The idea of anyone else owning our city is disgusting. The Ancient Greeks may not be here to do it for us, but let’s take their idea and burn everything to the ground. We will rebuild it after we return; it wouldn't be the first time."
 MEGA_events.6769.a:0 "There may be no horse, but flame will do its job regardless…"
 MEGA_events.6770.t:0 "Conquest of Troy"
 MEGA_events.6770.d:0 "After around 2500 years Troy has once again burned to the ground. It seems that no matter what is done, history will repeat itself. Last time though, the Ancient Greeks got famous, now it’s our turn."
 MEGA_events.6770.a:0 "We have had the iliad, now let’s avoid the Odyssey. Drowning isn’t something we want."
 MEGA_events.6771.t:0 "Defending More Than Just a City"
 MEGA_events.6771.d:0 "The Orthodox faith has been small since the expansion of our Christian neighbours. This doesn’t mean it is weak. We shall protect all those who follow it and defend ourselves against the expansion of the other religions. After all, we are nothing if not known for our defences."
 MEGA_events.6771.a:0 "Faith is the city of the worthy, Let us defend it."
 MEGA_events.6772.t:0 "Controlling the trade of the Aegean Sea"
 MEGA_events.6772.d:0 "It has been ages since we had such control over trade in the Aegean. Last time it happened, the Greeks found a reason to invade us with Helen of Troy, and if somebody else dares to copy them today, we are ready. Currently, though, it is smart to focus on controlling the trade even further and making some money to boot!"
 MEGA_events.6772.a:0 "Who doesn’t like money?"

