 Z43_ideas: "Trojan Ideas"
 Z43_ideas_start: "Trojan Traditions"
 Z43_ideas_bonus: "Trojan Ambitions"
 Z43_1: "Trojan Resilience"
 Z43_2: "The Spectre of Helen"
 Z43_3: "Legacy of Hector"
 Z43_4: "Tradition of Diplomacy"
 Z43_5: "Venerable Officer Corp"
 Z43_6: "The Industriousness of Troy"
 Z43_7: "Unrelenting Will"
 Z43_1_desc: "From the horse lords from the east to the Christians of the west, since our return, we’ve always suffered and fought against others, yet we still live, doesn’t that say something about our soldiers?"
 Z43_2_desc: "The stories may tell of a war because of Helen of Troy, but in reality it was the grip on trade in the Aegean Sea that resulted in the war."
 Z43_3_desc: "Led by Hector of Troy during the long years of the siege, fighting in wars for our existence against crusaders, horse lords and traitors has resulted in mindset of never giving up. Our armies will fight and keep fighting until we can no more."
 Z43_4_desc: "We couldn’t have lasted 10 years without are many allies. It requires a deft hand in diplomacy to keep so many through a siege."
 Z43_5_desc: "Our country has its litany of legends. Hector and his brothers in ages past, our kings that allowed for the resurgence of Troy in the Middle Ages and of course the men that grew Troy to what it is today. We should do their stories proud and continue this tradition of great generals."
 Z43_6_desc: "Rebuilding Troy and our country after every war has thought us not only how to bounce back, but how to build better than before. Developing our country is a must to keep up with the times and revitalize damaged land."
 Z43_7_desc: "You would be surprised at how difficult it is to keep fighting outnumbered for 10 years straight, steady morale is required to do so."

