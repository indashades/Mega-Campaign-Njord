l_english:
 IndiaGC_events.1.t:0 "The Great Indian Conquest"
 IndiaGC_events.1.d:0 "With the trade your nation has finally consistantly maintained with india, your people have come to the realization that they'd rather have their own port directly situation in the indian heartland. Maybe its time to set a foothold, throught negotiations or war."
 IndiaGC_events.1.a:0 "Onwards to India"
 two_institutions_ahaed_of_us:0 "Have embraced two Institutions ahead of us."
 european_meddling:0 "European Meddling"
 catch_up_institutions:0 "We have embraced the same or greater number of Institutions."
 capital_in_europe:0 "Capital in the Europe Continent."
 remove_all_european_influences:0 "This will cancel all disasters, events and actions related to european meddling in our continent."
 No_Europe_in_india:0 "No european nation has a province in India."
 Overrule_European_Meddling_title:0 "Overrule European Meddling"
 Overrule_European_Meddling_desc:0 "It's time we take the destiny of our continent into our own hands. Why must we have these invaders attempt to invade this lands that do not belong to them."
 cb_vassalize_indian_lord:0 "Vassalize Indian Nation"
 cb_vassalize_indian_lord_desc:0 "These nations have not been able to maintain a front agaisnt us, being clearly too occupied dealing with internal and external issues. Maybe its time for us to take over as their liege, and move them closer to our interests."
 indian_feudalism:0 "Indian Feudalism"
 indian_feudalism_tt:0 "Indian Feudalism"
 IndiaGC_events.2.t:0 "The Indian Feudalism"
 IndiaGC_events.2.d:0 "The Indian continental ruling system has been described as influenced by a very weak enforcement of power over conquered regions, which led to the resumption of independance and some high administrative dificulties ruling the continent. As such, the form of rulign tended to be very short lasting if enforced, or slow and gradual."
 IndiaGC_events.2.a:0 "Lets begin"
 EST_VAL_SATISFIED_WITH_AUTONOMY_GAIN:0 "Satisfied with Autonomy Gain"
 IndiaGC_events.3.t:0 "Indian vassals act with ever more autonomy"
 IndiaGC_events.3.d:0 "The power of the Bahamis has been increasing steadily in your country, and little by little the regions more distant from the capital have started to get some liberties in their obligations to you. Slowly they have started to work autonomously and getting away from you. If things keep on they might start breaking away from your direct control, but pushing back might bring out some resistance from the nobility."
 IndiaGC_events.3.a:0 "Let them have their autonomy."
 IndiaGC_events.3.b:0 "This is unnaceptable!"
 failure_of_caste_integrity:0 "Failure of Caste Legitimacy"
 all_indian_nations_become_vassals:0 "All Indian Vassals under your realm gain autonomy to become your vassal."
 IndiaGC_events.4.t:0 "Indian vassals act with ever more autonomy"
 IndiaGC_events.4.d:0 "Our rule legitimacy and corruption have caused our vassals to ignore our right to rule and went out of their way believing they should be able to gain their own independance. If we don't get them back into our embrace, we might risk losing our realm."
 IndiaGC_events.4.a:0 "The traitors shall pay."
 Declare_Absolute_Rule_Of_India_title:0 "Reform Indian Feudalism" 
 Declare_Absolute_Rule_Of_India_desc:0 "While it has been tradition for years, it has come time to reform our systems of feudal rule to match those of external countries, giving us a more stable and fundamental hold over our policies and works. The indian state should be an idea shared by all, one to rival that of China!"
 zamidar_vassal_title:0 "Zamidar" 
 zamidar_vassal_is_our:0 "Is our Zamidar"
 zamidar_vassal_title_plural:0 "Zamidar"