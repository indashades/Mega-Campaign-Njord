 angevin_nobles_reform: "Confirm Angevin Nobles"
 angevin_nobles_reform_desc: "The French Kings on Anjoy decided to grant privileges to the noblemen of the Kingdom, greatly increasing their influence over the judicial system. This helped secure the nobilities loyalties after French Conquest of the Kingdom over the Hohenstaufer Germans."

 neapolitan_renaissance_reform: "Neapolitan Renaissance"
 neapolitan_renaissance_reform_desc: "During the renaissance, the Kingdom of Sicily and Naples truly flourished. The Royal Court filled with many great inventors, artists and humanists. The cities would come to massively develop and rival the northern italian cities. Let us truly embrace the renaissance and let it flow throughout the entirety of the Kingdom."

 theatines_reform: "Theatines"
 theatines_reform_desc: "In reaction to the Catholic reforms of the 15th and 16th century, the 'Theatines' founded communities all over the italian peninsula, especially in the more traditional south. These communities would, upon taking vows to povery, obedience and chastity, be granted papal blessings and mend the relations between the Papal States and the Neapolitans."
 mechanic_enables_mary_of_the_purity_yes: "Theatine Purity: §G-0.05§! Yearly Corruption for every Tolerance of the True Faith over §Y5§!, up to a maximum of §G-0.2§!."
 GE_Mary_Of_The_Purity_1: "Theatine Purity"
 GE_Mary_Of_The_Purity_2: "Theatine Purity"
 GE_Mary_Of_The_Purity_3: "Theatine Purity"
 GE_Mary_Of_The_Purity_4: "Theatine Purity"

 nunziatella_reform: "La Nunziatella"
 nunziatella_reform_desc: "The 'reale Accademia Miliare' is an educational institute with the purpose of educating and training the various generals, captains and military command of the Kingdom. Taking great inspiration from the Ferrarese King Alfonso I, the academy places a great emphasis on the employment of cannons, artillery and siege equipment to maximize their potential in various fields."
 mechanic_enables_artillery_academia_yes: "Academy of Artillery: §G+1§!£shock£Artillery Shock while Army Tradition is at §Y75§! or higher."
 BM_academy_of_artillery: "Academy of Artillery"
 BM_academy_of_artillery_desc: ""

 parliament_of_sicily_reform: "Parramentu Sicilianu"
 parliament_of_sicily_reform_desc: "The sovereignty of the Kingdom of Sicily was assured to the long-lived parliamentary tradition based in Palermo. The Sicilian parliament is considered one of the oldest in the world and will continue to guarantee that, even if our Kingdom falls to outside influence, the Sicilians will always remain free."

 customs_house_of_apena_sheep_reform: "Customs House of Apena"
 customs_house_of_apena_sheep_reform_desc: "Originally a Aragonese institution, the Custom House was a way of organizing the rural, and often highly autonomous, pastorial south. This policy, which forced the shepherds to winter in specifically designated grazing grounds, ensured that they always remained in a firm grasp and could be kept a close eye on. It also ensured that additional meat and whool would reach the cities and merchant as well as helping to define exact territorial and city borders within the Kingdom."
 mechanic_enables_customs_house_yes: "Customs House: §G+25.0%§! Goods Produced and §G-25.0%§! Governing Cost in provinces with §YWool§!, §YLivestock§! or §YCloth§!"
 GE_Customs_House: "Customs House"
 desc_GE_Customs_House: ""

 constitution_of_melfi_reform: "Constitution of Melfi"
 constitution_of_melfi_reform_desc: "The ancient constitution of Melfi has kept our Kingdom prosperous and our monarchs powerful throughout the ages. Originally based on the customs and laws of the Norman kings, and later expanded upon by the German Emperors before being the inception of Spanish rule, these documents have stood the test of time and will continue to form the bedrock of our future!"
 mechanic_enables_liber_augustalis_yes: "Liber Augustalis: §G+5.0%§! All Estate Loyalty Equilibrium while Legitimacy is over §Y90§!."
 BM_melfi_constitution: "Liber Augustalis"
 BM_melfi_constitution_desc: ""


 # ENGLAND
 abolish_bastard_feudalism_reform: "Abolish Bastard Feudalism"
 abolish_bastard_feudalism_reform_desc: "Bastard Feudalism was centred around not the financial aspect, the sums involved were mostly negligible, but on the concept of services in exchange for good favour. In a society governed on a personal basis, service to a lord was the best way to obtain favour in the form of offices, grants, title and pardons. Lords would retain administrators and lawyers, as well as recruit local gentry into their affinities. By offering money instead of land, lords could afford to retain more followers, granting them much power over English politics and over the English countryside. In return for becoming retainers, the gentry would expect to rely on their lord's influence in local and national politics. This practice was known as "maintenance". During good times with a prestigious and stable King, this system would promote stability, but under a weak king, such as Henry VI , the rivalries of the would often spill over from the courtroom to armed confrontations, leading to civil war and a undermined royal authority."


 #PERSIAN
 turkic_qasilbash_heirs_reform: "Turkic Qizilbash Heirs"
 turkic_qasilbash_heirs_reform_desc: "The heirs of the Turkoman Qizilbash military forces are excellent stock for the noble positions of power in our lands. Their military background and fanatic devotion to the Shi'ite cause is sure to serve us well."
 mechanic_enables_qizilbash_company_yes: "Qizilbash Riders: Gain access to the zealous '§YQizilbash§!' Mercenary Company."
 merc_local_qizilbash_company: "Qizilbash Riders"

 tajik_administration_reform: "Tajik Administration"
 tajik_administration_reform_desc: "The Turko-Persian Iranian state was build by the Turkoman Qizilbash forces, but it was ruled by the ancient Persian traditions. The legacy of Persia managing to time and time again be born from the ruins of other empires by efficiently administrating and integrating foreign and domestic cultures is legendary."


 foreign_ghulams_reform: "Ghilman Ghulams"
 foreign_ghulams_reform_desc: "The Caucasian wars brought in many slaves and captives. Let us promote them to powerful positions to create a third force alongside the Turkic military and the Persian administration to balance them and solidify the royal power."


 ghulam_governates_reform: "Ghilman Governates"
 ghulam_governates_reform_desc: "By granting the Ghilman posts as governors, the Shah was able to reduce the influence of the Persian noble and clergical influences on his reign, and solidify his rule."
 mechanic_enables_ghulam_governors_yes: "Ghilman Governors: Unlocks the '§YGhilman Governors§!' Privilege for the Ghilman which grants up to §G-0.05§! Monthly Autonomy Change and §G+25.0%§! Governing Capacity Modifier depending on land ownership."
 estate_ghulams_governor_positions: "Governor Positions"
 estate_ghulams_governor_positions_desc: "The Ghilman have proven more reliable and less corrupt then the local persian nobility, and as such we shall send several of our chosen Ghilman to work as governors in highly corrupt and unruly states."

 armenian_silk_traders_reform: "Armenian Silk Traders"
 armenian_silk_traders_reform_desc: "By resettling many of the trade centers on the silk road with captive Armenians Abbas secured both the pacification of the region, as well as the repopulation and prosperity of the silk road, because as we all know, the silk must flow."
 mechanic_enables_silk_traders_yes: "Armenian Silk Traders: As long as we are trading in Silk we will gain §G+15%§! Trade Efficiency. \n \nThe '§YCaucasus Traders§!' Privilege for the Ghilman no longer decreases Burgher loyalty, influence nor Max Absolutism."
 BM_silk_traders: "Armenian Silk Traders"
 estate_ghulams_trade_privileges: "Caucasus Traders"
 estate_ghulams_trade_privileges_desc: "Having loyal traders that serve the monarch rather then themselves is an excellent way of ensuring the royal treasury doesn't run out of funds."

 principle_of_fiqh_reform: "Principle of Fiqh"
 principle_of_fiqh_reform_desc: "By dividing the powers of civil and criminal justice we can ensure that civil matters are handled by the imams and judges of law, following the Islamic Sharia Law. While the Criminal Law is executed by our local governors in the name of the Shah, granting the people the freedom to be judged under the true faith, but making sure that criminal justice remains a powerful tool in the hands of the Shah to maintain order and secure his power."


 #MUSCOVITE RUSSIAN
 muscovite_manorialism_reform: "Muscovite Manorialism"
 muscovite_manorialism_reform_desc: "By settling loyal veterans into the crown lands we can establish a system of administrators that serve the crown rather then local princes or guilts."



 #ARAGON
 ARA_crown_of_aragon: "Crown of Aragon"
 ARA_crown_of_aragon_desc: "The Crown of Aragon was a monarchy comprised of a dozen Kingdoms; The Kingdom of Aragon, Majorca, Sardinia, Sicily, Naples, as well as the Principalities of Catalonia and Andorra, the Duchy of Athens, Neopatria, The City of Valencia and the County of Gevaudan and Provence. This extreme fragmentary state of the Crown of Aragon has led to a complex web of systems, laws, practices and networks that has made the feudal order rather decentralized."
 mechanic_BM_enable_crown_of_aragon_yes: "Crown of Aragon: The areas of §YAragon§!, §YCatalonia§!, §YValencia§!, §YSardinia§! and §YSicily§! will receive unique bonuses."
 BM_crown_of_aragon_aragon_area_modifier: "Kingdom of Aragon"
 BM_crown_of_aragon_catalonia_area_modifier: "Principality of Catalonia"
 BM_crown_of_aragon_valencia_area_modifier: "City of Valenica"
 BM_crown_of_aragon_corsica_sardinia_area_modifier: "Kingdom of Sardinia"
 BM_crown_of_aragon_sicily_area_modifier: "Kingdom of Sicily"


 #AFRICAN
 kingdom_of_gao_reform: "Kingdom of Gao"
 kingdom_of_gao_reform_desc: "Hailing from the powerful city of Goa, we have grown strong and thrown off the Malian overlordship, and are ready to claim the Niger Valley as our own."

 slave_farmer_reform: "Slave Farmers"
 slave_farmer_reform_desc: "Victims of war and raids are put to work in newly established villages. Trough the granting privileges to the slaveholders we can increase their productivity and allow them to expand their slave settlements."
 BM_slave_settlements_modifier: "Slave settlements"
 desc_BM_slave_settlements_modifier: ""
 mechanic_BM_enable_slave_settlements_yes: "Slave Settlements: Provinces with §YGrain§!, §YLivestock§! or §YSlaves§! gains '§YSlave Settlements§!' modifier granting §R+1§! Unrest, §G+10.0%§! Goods Produced Modifier and §R-40.0%§! Tax Modifier."

 kinsmen_governors_reform: "Kinsmen Governors"
 kinsmen_governors_reform_desc: "Through the use of our kinsmen as governors rather then unrelated nobles, we can ensure their loyalty to the monarch."

 slave_soldiers_reform: "Slave Soldiers"
 slave_soldiers_reform_desc: "By training and arming groups of slaves and making them function as a standing army we can ensure that our forces are better trained and will ensure we can rely on our soldiers without being dependent on tribal or noble troops!"

 farba_system_reform: "Farba System"
 farba_system_reform_desc: "A 'Farba', or great commander, was an honorary title worn by the Malian commander that accompanied the vassal kings of the Mali Empire. By leaving the civilian rule over a province in the hands of the natives and keeping the military control in the hands of a Malian loyalist, uprisings could be crushed before they gained momentum."

 farari_commanders_reform: "Farari Commanders"
 farari_commanders_reform_desc: "Farari, or brave men, were cavalry captains that led a company of cavalry and directed several companies of infantrymen during campaigns and battles. These infantrymen, led by a 'Kele-koun', or war-heads, were freemen equipped by their local custom or by their commander in case of poverty."
 farari_commanders_modifier: "Farari Commanders"
 desc_farari_commanders_modifier: ""



 #INDIAN NEPAL BENGAL VIJAYANAGAR ETC
 gorkha_kingdom_reform: "Gorkha Kingdom"
 gorkha_kingdom_reform_desc: "Our mountain kingdom blending the military might of the Gorkhali and Rajput military power will ensure our search for natural resources will be swift and our neighbors will cower as we rise."

 maharajadhiraja_reform: "Mugarajadiraja"
 maharajadhiraja_reform_desc: "Meaning "great king of kings" it is a symbol of our superiority over the other states around us and our desire to be the ruler of all who oppose us."

 chhetri_clans_reform: "Chhetri Clans"
 chhetri_clans_reform_desc: "TO-DO"

 #UNSPECIFIED / COMMON

 industrialized_farming_practices_reform: "Industrialized Farming Practices"
 industrialized_farming_practices_reform_desc: "With the help of state subsidies and the employment of Imperial Surveyors across our Empire, we can most efficiently reorganize our farmlands into Imperial Farm Estates. These Estates will be owned directly by our Heavenly Emperor, governed by our most trusted vassals, and further industrialized to achieve agricultural outputs enough to feed our Empire."

 tariffs_and_trading_reform: "Closed Haijin Economy"
 tariffs_and_trading_reform_desc: "Foreign merchants cannot be trusted to not destabilising our markets to further enrichen themselves. By completely closing our ports and towns off from foreign leeches and instead focusing on internal trade we can further embolden our own production and economy."

 magnate_law_reform: "Magnate Law"
 magnate_law_reform_desc: "By granting the magnates privileges for their domains, we can leverage the burden of keeping the peasants in check to the nobles."
 mechanic_enables_magnate_law_yes: "Magnate Law: Unlock the '§YMagnate Law§!' privilege for the Nobility, granting up to §G-3.0§! National Unrest based on Nobility Land Ownership as well as §G-50.0%§! War Taxes Cost."

 estate_nobles_magnate_law_privilege: "Magnate Law"
 estate_nobles_magnate_law_privilege_desc: "Through the granting of local autonomy we can please and pacify the nobility to the point of them solving most of local issues, disputes and revolts on their own."

 imperial_knights_reform: "Invite Imperial Knights"
 imperial_knights_reform_desc: "The Reichsritters, 'Imperial Knights', were the lower nobility of the Holy Roman Empire, holding little land, but often serving in the imperial army as sergeants or captains. By inviting them to move into our lands through the granting of privileges, we can employ these seasoned Knights into our army."
 mechanic_enables_imperial_knights_yes: "Imperial Knights: Gain access to the '§YImperial Knights§!' Mercenary Company."
 merc_local_imperial_knights_company: "Imperial Knights"

 franconian_salic_law_reform: "Salic Law"
 franconian_salic_law_reform_desc: "The Duchy of Franconia has been destroyed by the Salian Law, where brothers fought over inheritance and the royal power got divided into nothingness. Yet, the nobility prospered, and could provide us a great source of strength as long as we can keep them under control unlike our predecessors."

 guild_dominance_reform: "Guild Dominance"
 guild_dominance_reform_desc: "The various merchant, craftsmen, artisan and financial guilds across the Low Countries has always held a lot of power. By granting them access to the government through official channels we will be able to let our guilds expand their influence and expertise across our country."

 korps_mariniers_reform: "Korps Mariniers"
 korps_mariniers_reform_desc: ""

 last_expedition_reform: "The Last Expedition"
 last_expedition_reform_desc: ""

 lumiere_admin_reform_reform: "The Painters & Writers Guild"
 lumiere_admin_reform_desc: ""


 magnate_govenors_reform: "Magnate Governors"
 magnate_govenors_reform_desc: "By dividing our land in regions dominated by powerful nobles, we can use them to function as lord paramounts, capably organizing the regions making it much easier to hold control over vast lands."
 mechanic_enables_serfdom_yes: "Serfdom: Unlocks the '§YSerdom§!' privilege for the Nobility, granting §G+15.0%§! Governing Capacity Modifier but §R-50.0%§! Tax Modifier based on Nobility Land Ownership."
 estate_nobles_establish_serfdom: "Establish Serfdom"
 estate_nobles_establish_serfdom_desc: "By establishing serfdom we can ensure that peasants remain fixed on our land, making it easier to manage them. Though this will also grant our Nobility the rights to tax the peasantry as they wish."

 office_of_vitztum_reform: "Office of Vitztum"
 office_of_vitztum_reform_desc: "The Office of Vitztum was the office of the most important advisors to the Bavarian dukes. These advisors, called Vitztums, had the role of acting as deputy duke in newly conquered lands until the territories could be fully integrated into the royal administration."


 lithuania_law_reform: "Casimir's Code"
 lithuania_law_reform_desc: "The lands of Lithuania are a diverse mix of religions, cultures, laws and customs. By creating a set of common laws that applies equally to all people regardless of culture or religion, we can further strengthen our hold over the region as well as curb robber barons and getting rid of corrupt local laws."

 arch_monarchy_reform: "Arch-Monarchy"
 arch_monarchy_reform_desc: "Our monarch rules over multiple semi-sovereign lands, obtained through either cunning, conquest, or inheritance, bringing glory to all under their occupation. Though often difficult to administer, there lies no better path to prestige."

 granadan_iqta_reform: "Granadan Iqta"
 granadan_iqta_reform_desc: "Its excellent position at the crossroads of the Atlantic and the Mediterranean trade networks makes Granada a key hub of commerce. The Catalonian and Genoese traders have long brought goods to our harbors, and our massive population is skilled in the labors of herding, fishing and craftmanship. The silk and textile goods from our lands has been a key part of our economy. With the downfall of the Taifa emirates, many skilled craftsman have fled the Christian conquistadores... right into our open arms."

 duchy_of_luxembourg_reform: "Duchy of Lëtzebuerg"
 duchy_of_luxembourg_reform_desc: "Created by the Holy Roman Emperor in 1354, the county of Letzebuerg was elevated to the status of a duchy, empowering Wenceslaus of Luxembourg by absorbing neighbouring margraviates and counties, growing in both size and prestige. The new duchy would later give rise to multiple emperors!"

 growth_signoria_reform: "The Signoria"
 growth_signoria_reform_desc: "With the older power structures slowly dissolving in party strive and civil discord, many of our citizens look at strong men to restore order and disarm the feuding parties, by formalizing this position we'll be able to stabilize our realm in times of need."

 support_borghese_reform: "Support the Borghese"
 support_borghese_reform_desc: "A new and remarkable society has been emerging, a rich and expanding semi-aristocratic class, the borghese, interested in the urban institutions and republican government, by using this interest, we can stabilize our governing bodies, and resist monarchic influences."

 akritai_privileges_reform: "Akritai Privileges"
 akritai_privileges_reform_desc: "The Akritai were army units guarding the Empire's eastern border, facing the Muslim states of the Middle East. These units would be granted land on the border by the Emperor which they would then proceed to cultivate and live off as well as guard it against outside threats."
 GE_Fortified_Settlement: "Akritai Forts"
 desc_GE_Fortified_Settlement: ""
 mechanic_enables_fortified_settlements_yes: "Akritai Forts: §G-5%§! Development Cost and §G+15.0%§! Manpower Modifier in states with forts."

 council_of_sheikhs_reform: "Council of Sheikhs"
 council_of_sheikhs_reform_desc: "Since the days of the Almohad dynasty, The Caliph has held a council of sheikhs of the tribes and peoples under his hegemony, we should re-intstate this council in order to fill our need for troops and control."

 arch_marshal_reform: "Arch-Marshal Of The Empire"
 arch_marshal_reform_desc: "We are the Arch-Marshal of the Holy Roman Empire, and our ferocity will make everyone know why we hold and deserve this office!"
 mechanic_BM_buffed_increased_levies_yes: "Increased Levies Nobles Privilege will gain §G-15.0%§! Regiment Cost and §G-1.0§! Yearly Army Tradition Decay."

 clans_of_ireland_reform: "Clans of Ireland"
 clans_of_ireland_reform_desc: "The Irish nobility is not the same as the nobles of Western Europe. The 'nobility' is instead powerful clansmen who hold local power and sway over various villages, towns and infuential families. By granting them more influence and power we will be able to rally the many Clans to our ranks."

 nationalized_cetas_reform: "Nationalized Cetas"
 nationalized_cetas_reform_desc: "The Shishmanov family showed us that even in death, Bulgaria could terrorize a nation, we should arrange for the prestigious Noble families to train hadjuks just as skillful as the ceta so that if any enemy decides to siege Bulgaria, they're met with fierce resistance."
 nationalized_cetas_reform_upgraded: "Nationalized Cetas"
 nationalized_cetas_reform_upgraded_desc: "The Shishmanov family showed us that even in death, Bulgaria could terrorize a nation, we should arrange for the prestigious Noble families to train hadjuks just as skillful as the ceta so that if any enemy decides to siege Bulgaria, they're met with fierce resistance."

 krums_code_reform: "Krum's Code"
 krums_code_reform_desc: "While we admire our Christian and Slavic culture, the history of Bulgaria is much more confusing than that, we were once ruled by Khans, one particular Khan, Krum, created the first Bulgarian Written Law,  abiding by his code, we would give subsidies to beggars and state protection to the poor, while severely punishing the criminals of Bulgaria."
 krums_code_reform_upgraded: "Krum's Code"
 krums_code_reform_upgraded_desc: "While we admire our Christian and Slavic culture, the history of Bulgaria is much more confusing than that, we were once ruled by Khans, one particular Khan, Krum, created the first Bulgarian Written Law,  abiding by his code, we would give subsidies to beggars and state protection to the poor, while severely punishing the criminals of Bulgaria."

 mechanic_enables_codified_law_yes: "Codified Law: §G-2§! Unrest in provinces under 50% Autonomy."

 riksradet_norway_reform: "Riksradet of Norway"
 riksradet_norway_reform_desc: "To govern such a wide and rural country, as well as act as our countries Representatives in absence of our Monarch, The Riksradet functioned as a council of the powerful lords and bishops. Throughout the ages the autonomy and power of the Riksradet was being eroded by the Danish monarchs."

 regional_kasbah_reform: "Regional Kasbahs"
 regional_kasbah_reform_desc: "Traditionally we have used Kasbahs as a way to protect our settlements from rivals looking to plunder them. As the demand for our exotic produce has grown amongst foreign traders so has it grown amongst bandits and raiders in the region, this has made harvesting these resources inefficient due to raiding. We can work against this threat by establishing a regional system of walled citadels within important hubs of trade."
 mechanic_enables_caravanserai_yes: "Fortified Kasbahs: §G+5§! Trade power and §G-10.0%§! Development Cost in Centers of Trade with Forts."
 GE_Caravanserai: "Kasbah"
 desc_GE_Caravanserai: ""

 kingdom_of_cities_reform: "Kingdom of Cities"
 kingdom_of_cities_reform_desc: "With Arabia being so short on towns and farms, the city of Hormuz conquered many of the Arabian coastal cities and islands to create a wide web of small territories spread over a large area. This caused the administrative centers to be very easy to identify and control."

 tatar_mercenaries_reform: "Tatar Mercenaries"
 tatar_mercenaries_reform_desc: "By setting up tatar mercenary captains, we can use them to attract strong and loyal mercenaries in times of war."

 diamond_of_the_earth_reform: "Diamond of the Earth"
 diamond_of_the_earth_reform_desc: "Our city has such splendor that is is known as the 'Diamond of the Earth' far and wide, and it brings many people and pride to our nation."
 mechanic_enables_foreign_artists_yes: "Foreign Artists: §G+0.1§! Prestige per Merchant. Up to a maximum of §G1§! Prestige."
 Foreign_Artists_1: "Foreign Artists"
 Foreign_Artists_2: "Foreign Artists"
 Foreign_Artists_3: "Foreign Artists"
 Foreign_Artists_4: "Foreign Artists"
 Foreign_Artists_5: "Foreign Artists"
 Foreign_Artists_6: "Foreign Artists"
 Foreign_Artists_7: "Foreign Artists"
 Foreign_Artists_8: "Foreign Artists"
 Foreign_Artists_9: "Foreign Artists"
 Foreign_Artists_10: "Foreign Artists"

 customs_duties_reform: "Customs Duties"
 customs_duties_reform_desc: "Through having a wide web of imports we can ensure trade will keep coming in and that our share of these incomes reaches our coffers!, while we can not forget our mainland allies, so let us grant them an exception."

 integrate_moneyloaners_reform: "Integrate Moneyloaners"
 integrate_moneyloaners_reform_desc: "By incorporating branches of powerful banking houses, we can play them off of each other and guarentee better deals when we require funds."
 mechanic_BM_buff_merchant_guild_financial_aid_yes: "§YBurghers: Ask For Contribution§! decision now grants §G+1§! merchantilism."

 dhimmi_nobles_reform: "Dhimmi Nobles"
 dhimmi_nobles_reform_desc: "By allowing the Dhimmi class to hold noble titles, we can use their influence to both keep the dhimmi loyal, as well as levying taxes for such privileges."
 mechanic_BM_buff_promote_the_dhimmi_nobles_yes: "The '§YPromote the Dhimmi Nobles§!' privilege will no longer grant §R-5.0%§! Ulema or Nobility loyalty and will also grant §G+15.0%§! National Tax Modifier."

 mamluk_privileges_reform: "Mamluk Privileges"
 mamluk_privileges_reform_desc: "The foreign born pseudo-nobility that dominated the mamluk sultanate were distinguished from their egyptian lessers through a multitude of laws and privileges. Such as the right to bear arms or to rise to the higher civic positions."

 support_samurai_reform: "Support Samurai"
 support_samurai_reform_desc: "Samurai are hereditary warrior-elites who are disciplined in both the battlefield and the court. While we rule over them as daimyos, their loyalty can be fickle if not rewarded properly. Offering privileges to these hardy men will greatly satisfy them—and guarantee their aid in times of need."

 mint_towns_reform: "Mint Towns"
 mint_towns_reform_desc: "Mint Towns were considered the backbone of the economy of the Bengal Sultanate. These towns were usually important centers of trade or provincial capitals at which Taka coins were produced, hence the name Mint Towns. These coins depicted the status of the Bengali economy, the urban and administrative centers of the country, and were generally used as a form of currency. These towns were scattered all across the Bengali realm and played a pivotal role in its production of Taka coins and in administrating the growing kingdom."
 mechanic_enables_mint_towns_yes: "Mint Towns: Provinces with at least §T20§! Development will gain §G-25.0%§! State Maintenance and §G+10.0%§! Production Efficiency."


 timurid_prince: "Timurid Prince"
 timurid_prince_desc: "A semi-autonomous subject ruled by one of the many Timurid Princes, governing the lands of the greater Timurid Empire. This autonomy allowed the Prince to organize his own armies, foster his own supporters to the throne, and scheme to usurp the Timurid Emperor with little pushback."


 tai_and_ahom_reform: "Tai and Ahom"
 tai_and_ahom_reform_desc: "In the early 13th century, Sukaphaa, a Tai prince from Mong Mao, fled his homeland due to political intrigue and threats to his life, journeying westward with a small but loyal group of followers. They eventually settled in the Brahmaputra Valley, where they established the kingdom of Ahom, later known as Assam. Sukaphaa introduced the region's disjointed tribes to advanced agricultural techniques, coinage, and stone constructions, creating the groundwork for a centralized feudal kingship that stabilized the region. Although the Tai-Ahom was a minority, their expertise in rice farming and governance earned them a dominant position, revered as "fire-bringers" for their transformative impact. This small Tai group formed the kingdoms elite, wielding their knowledge as a tool of control while the local Vedic population made up the majority of society. Over the next two centuries the process of Ahomisation began to blend the Tai and Vedic cultures. Sanskrit script replaced the Tai alphabet, and a cultural fusion took root - Tai customs shaped the court and nobility, while Vedic traditions dominated religious life and festivals. This melding of traditions creates the Assamese culture, a unique synthesis of Tai martial bureaucracy and Vedic spirituality, marking the Ahom kingdom as a harmonious blend of influences from Tibet and India."

 sanskritization_reform: "Sanskritization"
 sanskritization_reform_desc: "As we embrace the Sanskrit Scriptures, our religious identity also evolve. The Hindu faith will begin to supplant our traditional beliefs. This process of adaption will enrich our cultural heritage, allowing us to preserve our unique identity while absorbing the spiritual and cultural depth of the Vedic world."

 shakti_the_supreme_deity_reform: "The Supreme Deity"
 shakti_the_supreme_deity_reform_desc: "Our state considers Shakti as the most prominent out of the Vedic deities. The Brahmins regularly preach of the divinity of the Devi and her several forms. To please the wrathful incarnation of Shakti, Maa Kaali, regular offerings of livestock must be performed before the commencement of any military campaign. This practice has instilled both respect- making mercenaries and blood-for-hire pledge their services to us- and fear for our state among anyone who dare oppose us."

 independence_reform: "Independence"
 independence_reform_desc: "The key virtue of the Swiss Confederacy is its firm belief in independence and self governance, as such we will endure and recover as many times as is needed."
 mechanic_BM_swiss_fighting_defensive_wars_yes: "\nDuring Defensive Wars we will receive: \nMax Hostile Attrition §G+1.00§! \nFort Defense: §G+15.0%§!"
 BM_swiss_fighting_defensive_wars: "Spirit of Helvetica"

 confederation_of_cantons_reform: "Confederation of Cantons"
 confederation_of_cantons_reform_desc: "The local control organized by individual cantons means that problems are fixed locally, lands can be developed locally, and each region is responsible for its own fortifications, leading them to make the best use of their natural resources and advantages."
 mechanic_BM_enables_mountain_towns_yes: "Mountain Towns:\nAll hills, highlands and mountains will have their development cost malus halved."

 #JAPANESE REFORMS / JAPAN REFORMS
 kyoho_reforms_reform: "Kyouhou Reforms"
 kyoho_reforms_reform_desc: "The Kyouhou reforms were a series of reforms across feudal Japan that included an emphasis on frugality as well as the consolidation of merchant guilds to create a more powerful control over trade and taxation."
 mechanic_BM_buff_merchant_guild_commercial_advisory_board_yes: "The '§YCommercial Advisory Board§!' privilege will grant up to §G+25.0%§! Merchant Trade Power Modifier scaling with influence."

 metsuke_system_reform: "Metsuke Ninjas"
 metsuke_system_reform_desc: "The Shogun wields massive power, but it hangs on a delicate balance, if our Daimyos sense that our authority is even slightly questionable, they will seize the opportunity to overthrow us. Therefore, it is vital we maintain a system of constant surveillance and intelligence gathering, so we are always able to act before the strike."
 mechanic_BM_buff_spymaster_advisor_yes: "Spymaster advisors will now grant §G-5.0%§! Annexations Relations Impact per Diplomatic skill."

 ashigaru_generals_reform: "Ashigaru Generals"
 ashigaru_generals_reform_desc: "After many decades of war, the might of one skilled Samurai Lord, while formidable, pales in comparison to the organized armies equipped with matchlock firearms- tanegashimas. Their efficiency lied on their strict formation and ability to stand still during enemy fire while delivering shot themselves. By modernizing our firearms and equipping our soldiers with our own matchlock firearms, we can bolster the might of our army several times over."

 reestablish_the_kuge_reform: "Re-establish the Kuge"
 reestablish_the_kuge_reform_desc: "With the rise of the Buke, warriors who swore loyalty to the Shogunate, the Kuge were relegated to lower-class positions or even abandoned entirely. This class of court officials, art patrons and skilled diplomats and commoners who are especially adept in the know-how of ruling a country. The way of the warrior may be honourable, but a country that knows only war will inevitable end in war. Let us re-establish the Kuge back into our administration."


 #PAPACY BUFF
 mechanic_BM_church_sanctuaries_buff_yes: "The '§YChurch Sanctuaries§!' privilege will now also grant §G+10.0§! Prestige when building §YChurches§! or §YCathedrals§!."

 # Crusade Mechanic:
 # Reforms:
 mission_to_crusade_reform: "Mission to Crusade"
 mission_to_crusade_reform_desc: "Our holy God-given mission is to fight the infidels and reconquer the Holy Land for the true faith!"

 # Tooltips:
 mission_to_crusade_reform_tt: "Does NOT have §YTerm Elections§!"

 ## Mechanics:
 ability_crusade_power_mechanic: "Crusade Power"
 crusade_power: "Crusade Power"
 crusade_power_desc: "Crusade Power is a measure of how efficient and effective our fight against heretics and infidels is going. \n\nCrusade Power is gained by the following actions: \n   - Win a War against a Heretic: §G+20.00§! \n   - Win a War against a Heathen: §G+25.00§! [Root.crusade_power_mechanic_gain_from_winning_war_against_crusade_target] \n   - Force Convert a Country by War: §G+20.00§! \n   - Force Convert your Subject: §G+5.00§! \n\nCrusade Power is lost by the following actions: \n   - Lose a War against a Heretic: §R-25.00§! \n   - Lose a War against a Heathen: §R-35.00§! [Root.crusade_power_mechanic_gain_from_losing_war_against_crusade_target] \n   - Be Force Converted by War: §R-25.00§! \n\nThis is not affected by separate peaces, only when you as the war leader make peace with another war leader. Force converting a country will replace the gain from winning a war against them, you will not gain both. \n--------------\n"

 ## Power Modifiers:
 monthly_crusade_power: "Monthly Crusade Power Gain"
 crusade_power_gain_modifier: "Crusade Power Gain Modifier"

 ## Tooltips:
 crusade_power_at_100_tt: "The monthly decay is negated until our §YCrusade Power§! falls under §Y100.00§!."

 ## Customizable Localization:
 string_crusade_power_gain_from_winning_war_against_crusade_target: "\n   - Win a War against the Crusade Target: §G+35.00§!"
 string_crusade_power_gain_from_losing_war_against_crusade_target: "\n   - Lose a War against the Crusade Target: §R-50.00§!"


 #RAJPUT
 guhilawat_reform: "Guhilawat"
 guhilawat_reform_desc: "The Rathore dynasty has instituted a national martial code that has become a cultural obsession, demanding every man to perform his military duty with fervor. Despite being a small state, we have expanded our dynastic reach through diplomacy, fraternizing with Muslims, Hindus, Buddhists, Indians, Persians, Tibetans, and Europeans, creating a safety net that deters potential invaders. Our victories are not just due to our soldiers' skill or our army's composition but also our meticulous preparation. Scouts and spies are crucial, finding favorable battlefields, water sources, food, and medical care. Our spies sabotage enemy supply lines and gather critical information, understanding the enemy intimately to ensure victory."


 # Legitimation through Represenation Mechanic:
 legitimation_through_representation_reform: "Legitimation through Representation"
 legitimation_through_representation_reform_desc: "To legitimize their status and claim to power, rulers must demonstrate them. This can be done by military might, but not exclusively. Art, music and especially architecture are also means the rulers can use for their representative purposes."
 ## Mechanics:
 ability_legitimation_through_representation_mechanic: "Power Representation"
 legitimation_through_representation_power: "Power Representation"
 legitimation_through_representation_power_desc: "Power Representation - for example through art, music or architecture - is important to demonstrate the status and the ruler's claim to power. However, it is also very expensive to maintain. \n\nThe §YPower Represenation§! will decay faster, the higher it is and can be increased by spending power and money through court actions.\n\n"
 legitimation_through_representation_mechanic_obtain_new_paintings: "Obtain New Paintings"
 legitimation_through_representation_mechanic_obtain_new_paintings_desc: ""
 legitimation_through_representation_mechanic_host_a_court_festival: "Host a Court Festival"
 legitimation_through_representation_mechanic_host_a_court_festival_desc: ""
 legitimation_through_representation_mechanic_perform_an_opera: "Perform an Opera"
 legitimation_through_representation_mechanic_perform_an_opera_desc: ""
 legitimation_through_representation_mechanic_renovate_the_palace: "Renovate the Palace"
 legitimation_through_representation_mechanic_renovate_the_palace_desc: "§gRenovating the Palace is a costly and time consuming way to increase the ruler's Power Representation value. It will not grant an instant reward, but increase the Power Representation over time.§!\n\n"

 ## Power Modifiers:
 monthly_legitimation_through_representation_power: "Monthly Power Representation Change"
 legitimation_through_representation_power_gain_modifier: "Power Representation Change Modifier"

 ## Modifiers:
 legitimation_through_representation_mechanic_renovate_the_palace_modifier: "Renovation of the Palace"

 #Peasants:
 Peasant_Council: "Peasants Council"
 desc_Peasant_Council: ""

 peasant_council_reform: "Council of 48"
 peasant_council_reform_desc: "Our nation is not governed by feudal lords or bishops, but by the council of our best and brightest, so unlike the more organized nations, we are in no need of frequent elections to have excellent governance."

 peasant_militia_reform: "Peasant Militia"
 peasant_militia_reform_desc: "Our marshes are deep, our roads small and fortified. Any who dare cross them will find no rabble of farmers, but a well-trained and well-organized peasant militia. Their formation and use of the land hinders any attempts at bombardment or flanking. 'Wohr di, Goor, de Buur, de kump!'"

 mechanic_enables_bear_arms_yes: "Right to Bear Arms: Unlocks the '§YRight to Bear Arms§!' Privilege for the Peasants, which allows us to increase our Infantry Combat Ability."

  #TROIA TROY TROJAN
 MEGA_trojan_kingdom:0 "Trojan Kingdom"
 MEGA_trojan_kingdom_desc:0 "Our Kingdom is as glorious as the Trojans of old!"

 MEGA_troy_may_recruit_mamluks:0 "Elite Mamluk Guard"

 MEGA_elite_trojan_guards:0 "Expand the Elite Mamluk Guard"
 MEGA_elite_trojan_guards_desc:0 "By expanding our elite guard and integrating them back into our military as officers and educators of war we can make sure each and every one of our soldiers are expertly drilled by the best of the best."