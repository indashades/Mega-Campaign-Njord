 #COSSACK MECHANICS
 BM_fleeing_serfs_tt: "One of our bordering provinces will recieve §G1§! manpower Development"
 BM_settling_serfs_mod: "Settling Serfs"


 #SHOGUNATE
 BM_custom_mechanic_event.1.t: "Ronin Exiles"
 BM_custom_mechanic_event.1.d: "After the expelling of Ronin from the various major cities across Japan, the roaming Samurai has formed a masterless army seeking a Clan willing to take them in. Inviting them would provide is with an ample army for our Daimyo."
 BM_custom_mechanic_event.1.a: "Take these exiles in under our banner!"

 BM_shogun_every_daimyo_sword_hunt2_tt: "\nFor every §YDaimyo§! subject we will receive §G+5.0%§! Yearly Manpower. \n"
 BM_shogun_every_daimyo_sword_hunt_tt: "For §Y10§! years every §YDaimyo§! subject will receive: \nLand Force Limit Modifier: §R-15.0%§!\n"

 BM_shogun_every_daimyo_sankin_kotai_tt: "\nFor every §YDaimyo§! subject both us and our §YDaimyos§! will receive: §G+1.0§! Prestige. \n \nFor §Y10§! years every §YDaimyo§! subject will receive: \nMonthly Autonomy Change: §R+0.05%§! \n"

 BM_shogun_every_daimyo_expel_ronin2_tt: "\nEvery §YDaimyo§! subject will receive get §G+1§! £adm£, £dip£ or £mil£ development in their capital. \nFor every §YDaimyo§! subject both us and our §YDaimyos§! will receive: §G+1.0§! Army Tradition. "



 #PRUSSIA
 frederick_wilhelm_reforms_prussia:0 "Frederick Wilhelm's Reforms"
 frederick_wilhelm_reforms_prussia_desc:0 "Frederick the Great reorganized the Prussian Economy by establishing additional protections for religious minorities, a national bank, tax reforms, and industrial investments. As a direct result from these policies and reforms, many religious immigrants, fleeing from persecution and war, came into Prussia. These immigrants formed large communities and settled in the less developed parts of the nation, helping boost the industrial output and contributing to the urbanisation that started forming around this time."
 mechanic_enables_immigrant_settlements_yes: "Every province with §Y20§! Development will gain: \n Construction Cost: §G-15.0%§! \n Governing Cost: §G-10.0%§!"

 BM_immigrant_settlements:0 "Urbanized Settlements"
 desc_BM_immigrant_settlements:0 ""


 kreditwerk_reform: "Reformed Kreditwerk"
 kreditwerk_reform_desc: "In the 16th century, the Margraves of Brandenburg had become highly dependent and on several occasions highly indebted on the estates (counts, lords, knights and towns). To combat this, the Kreditwerk was established as an independent institution, not controlled by by the elector or the Großer Ausschuß 'Great Committee' of the estates. This institution was tasked with managing the the Margraviates taxation, finances and liabilities and became central to reforming the Margraviates, and later on, Prussias, economy."

 mechanic_upgrade_promote_burghers_bookkeeping_yes: "The '§YPromote Burghers Bookkeeping§!' privilege will no longer cost Absolutism and also grant: \n Interest Per Annum: §G-0.25§! \n Yearly Inflation Reduction: §G+0.05%! \n"

 mechanic_upgrade_control_over_monetary_policy_yes: "The '§YCommercial Advisory Board§!' privilege will no longer cost absolutism or increase Stability Cost."

 order_of_the_swan_reform:0  "Order of the Swan"
 order_of_the_swan_reform_desc:0 "The Order of the Swan has been a great success across our realm. By opening up the order to our neighbours we can increase the prestige of the Order and attract devout soldiers from all around the Christian world."


 #AUSTRIA
 albertine_line_reform: "Albertine Line"
 albertine_line_reform_desc: "As our family holds most of the Austrian Heartlands, we shall never have to look far for potential heirs or willings oldiers. Just as when the Albertine line died in 1457, we took over our cousin's crown, and our cousins are more then willing to continue carrying our banner should our strength run short."


 imperial_inquisition_reform: "The Imperial Inquisition"
 imperial_inquisition_reform_desc: "To fight the Heretical spread of dissidence against the Catholic church we shall institute the Imperial Inquisition to hunt down these lost souls."


 reorganize_the_imperial_army: "Re-Organize the Imperial Army"
 reorganize_the_imperial_army_desc: "The age of seasonal warfare is ending, disbanding armies by winter and recruting new ones for the spring campaign is too costly in the age where disciplined soldiers with pike- and shot form the backbone of armies. Furthermore, during these multi-seasonal wars, why should we bear the burden to pay for the armies our enemies forces us to raise? 'When the army marches, the enemy pays!'"

 mechanic_enables_reorganize_the_imperial_army_yes: "During peacetime we will receive the same benefits of '§YRaise War Taxes§!' without costing £mil£"
 BM_hab_reorganize_the_imperial_army_triggered_modifier: "Peacetime Mobilization"
 BM_hab_reorganize_the_imperial_army_triggered_modifier_desc: ""


 declario_ferdinandei_reform: "Declaratio Ferdinandei"
 declario_ferdinandei_reform_desc: "The principle known as 'Ferdinand's Declaration' excempted knights and some cities from the requirements of religious uniformity. This allowed for a few mixed cities and towns where Catholics and Lutherans could live together. It also protected the authority of the princely families, knights, and nobles who had converted. This would overall lessen the blow that the Protestant Reformation had done to the Imperial Authority to the Emperor, at least within the realm of [Root.Getname]."


 diverse_estates_reform: "Diverse Estates"
 diverse_estates_reform_desc: "Having to keep the Hungarian, German and Bohemian estates all loyal to the [Root.GetAdjective] cause is a challenge. Our experience in juggling them, placating them with gold, words and threats has left us with an experience diplomatic corps that are well versed in how to best sweeten our deals."
 mechanic_enable_diverse_estates_reform_yes: "Completing Agendas will reward a random §YCzech§!, §YHungarian§! or §YGerman§! province with §G1§! £adm£, £dip£ or £mil£ development."





 #POLAND
 szlachta_authority_reform: "Szlachta Authority"
 szlachta_authority_reform_desc: "By granting the Szlachta additional power and influence, we can ensure their complacency, both in serving our forces as well as reducing the likelyhood that they start trouble."

 re_enforce_magdeburg_rights_reform: "Magdeburg Rights"
 re_enforce_magdeburg_rights_reform_desc: "While similar conflict among the social classes could be found across all of Europe, nowhere was the nobility as dominant at the time as in Poland, and later the Polish-Lithuanian Commonwealth. Much debate has been made between historians as to which processes affected this development, since until the wars and crises of the mid-17th century the cities and centers of important trade of the Commonwealth had not markedly lagged behind in size and wealth compared their western counterparts. The Commonwealth did have numerous towns and cities, commonly founded on 'Magdeburg Rights'."


 BM_magdeburg_rights: "Magdeburg Rights"
 desc_BM_magdeburg_rights: ""
 mechanic_enables_town_rights_yes: "Provinces with either a §YCenter of Trade Level 2§!, an §YEstuary§!, or §Y25§! Development will receive '§YMagdeburg Rights§!' granting: \nLocal Development Cost: §G-10.0%§! \nLocal Goods Produced Modifier: §G+10.0%§! \nLocal Trade Power Modifier: §G+10.0%§!"






 #SWEDEN
 office_of_lord_regent_reform: "Office of Lord Regent"
 office_of_lord_regent_reform_desc: "The Lord Regent was a position held to the head governor of the highly autonomous Kingdom of Sweden. Danish Kings often tried to abolish or weaken this position, only to be met with fierce resistance or independence wars to restore Swedish Autonomy."


 house_of_knights_reform: "House of Knights"
 house_of_knights_reform_desc: "The Swedish Hereditary Nobility was established following Eric the 14th's formalization of nobility. By 1626 the House of Knights represented the nobility and maintained their records and geneology. Following the practice of ennobling officers instead of paying them, many houses of lesser nobility can trace their lineage back through this system, registered in the House of Knights."
 mechanic_BM_house_of_knights_yes: "On §YMonarch Ascensions§!, we will gain a supplemantary §GRuler Modifier§!"


 the_red_book_reform: "Swedish Church Ordinance"
 the_red_book_reform_desc: "The 'Swedish Church Ordinance' were a set of Swedish reformations of Lutherianism that allowed some catholic practices as well as allow catholic orders to grow again by taking on new novices."


 the_judicature_ordinance_reform: "The Judicature Ordinance"
 the_judicature_ordinance_reform_desc: "The Judicature Ordinance established the Supreme Court. Later additions relaxed the process of appeal somewhat by restoring the king's authority and giving him the exclusive right to administer death sentences. The continuance of the local jury and a culture of respecting the law allowed for protected civil liberties."


 parliamentary_order_reform: "Parliamentary Order"
 parliamentary_order_reform_desc: "The Parliamentary Order set up the Parliament of Sweden, where the four represented estates, the nobles, clergy, burghers and peasants, could work together to propose new laws to increase the prosperity of the nation."
 mechanic_enables_peasant_estate_yes: "Enables the Peasants Estate."


 gustavan_artillery_reform: "Gustavan Artillery"
 gustavan_artillery_reform_desc: "Field artillery has long been a static emplacement for firing before the battle starts. Let us use lighter pieces on the battlefield itself for additional firepower and mobility, let us shred the Imperial Tercios to pieces!"

 mechanic_BM_gustavan_artillery_reform_yes: "Winning Fort Sieges grants §G5%§! Yearly Manpower per Fort Level."






 #BOHEMIA

 vladislavs_provincial_establishment_reform: "Vladislav's Provincial Establishment"
 vladislavs_provincial_establishment_reform_desc: "Written during the Bohemian Wars, this code of laws was the first to wholly encompass and implement Bohemian state laws. Most of the 554 articles of the code pertainted to the privileges of the nobility, which limited the monarchs influence and jurisdiction and placed the nobles above cities in legal matters."
 mechanic_enable_vladislavs_provincial_establishment_yes: "\nCompleting Agendas from the Nobility will grant §G+1§! Stability or §G50§! £adm£"

 restored_land_establishment_reform: "Bohemian Crown Supremacy"
 restored_land_establishment_reform_desc: "Following the end of the civil war over the Czech rebels on White Mountain, the King of Bohemia and Margrave of Moravia issued decrees to restore law and order as well as the supremacy of the Bohemian Crown. Furthermore, the legal status of the Nobility was depricated to it being secondary in rank after the Clergy in state assemblies."


 german_aristocracy_reform: "German Aristocracy"
 german_aristocracy_reform_desc: "Following centuries of Luxembourger and Habsburger reign as well as being firmly placed inside the confines of the Holy Roman Empire, the German language and heritages were commonplace in the courts of the Bohemian Kings. This policy greatly increased the loyalty with German nobles who would often be closely intertwined with their Czech counterparts."








 #HESSE
 hessian_militarized_monarchy_reform: "Hessian Militarized Monarchy"
 hessian_militarized_monarchy_reform_desc: "The Duchy of Hesse needs no undisciplined, greedy foreign mercenaries to defend her, she needs only her own men. We have militarized our state to a degree that one out of every seven men is in the army, and he will fight for his homeland, not the filling of his pocket."

 hessian_modern_militarized_monarchy_reform: "Enlightened Hessian Military State"
 hessian_modern_militarized_monarchy_reform_desc: "Friedrich of Cassel's Reforms, based on Prussian Militarism from his experience serving in their army, has transformed Hesse into the most militarized state in Europe. Our enemies fear us and our people prosper from our victories."


 hessian_elite_jaegers_reform: "Elite Jägers"
 hessian_elite_jaegers_reform_desc: "The Hessian Jäger (Sharpshooter) is armed with three things: ruthlessness, discipline and his büchse. This ruthlessness is greatly benefician to us, though their equipment is quite expensive."


 found_the_rothschilds_reform: "Support the Rothschild Dynasty"
 found_the_rothschilds_reform_desc: "Our Hoffaktor (Court Jew) is a talented man, and his abilities would be wasted with the limitations of a lowborn. Let us raise him to nobility and empower his family so they can help us further. Perhaps they will make a real name of themselves someday."

 hessian_military_complex_reform: "Military Industrial-Complex"
 hessian_military_complex_reform_desc: "The income from our trooops' expeditions in foreign lands will go to turning Hesse into a rich home for the returning men. By focusing on building a proper industry around our armies we will surely make our nation prosper."
 mechanic_enables_military_exports_yes: "§YBarracks§! and §YTraining Fields§! gives §G+7.5%§! / §G+15.0%§! Production Efficiency \n§YRegimental Camps§! and §YConscription Centers§! gives §G+15.0%§! / §G+30.0%§! Local Defensiveness \n§YSoldiers Households§! gives §G-15.0%§! Local Regimental Cost"
 BM_military_exports_barracks_modifier: "Industrialised Barracks"
 BM_military_exports_training_fields_modifier: "Industrialized Training Fields"
 BM_military_exports_regimental_camp_modifier: "Industrialized Regimental Camps"
 BM_military_exports_conscription_center_modifier: "Industrialized Conscription Center"
 BM_military_exports_soldiers_households_modifier: "Industrialized Soldiers Household"








 #DENMARK
 constitutio_valdemariana_reform: "Valdemars Constitution"
 constitutio_valdemariana_reform_desc: "The 'Constitutio Valdemariana' was a compromise of the nobles of Schleswig and Holstein between the Danish King stating that they would not be allowed to unite under one singular individual. The Danish King often circumvented this by appointing their heir as co-ruler of the powerful duchy which would prove useful in training Danish heirs for the rule of the Kalmar Union and increase Danish influence over Schleswig-Holstein."

 mechanic_enable_valdemar_constitution_yes: "The '§YNobility Integration Policy§!' privilege will now also give: \nManpower in Accepted Culture Provinces: §G+10.0%§!"


 commoner_officials_reform: "Commoner Officials"
 commoner_officials_reform_desc: "King John of Denmark focused on expanding his royal power through the acquisition of funds by promoting merchants and commoners as officials and councillors. Not only did they prove to do just as good of a job as the Nobles, but were also much cheaper and less prone to corruption."


 snaphaner_reform: "Employ the Snaphaener"
 snaphaner_reform_desc: "Snaphanerne (The Quickshots) were Scanians, sometimes Swedish speaking danes and other times Danish speaking swedes, who often refused foreign conquest from both Sweden and Denmark. Their fiery spirit for sovereignty will make them serve as excellent riflemen in our armies."


 strenghten_the_haeren_reform: "Strenghten the Hæren"
 strenghten_the_haeren_reform_desc: "The Hæren, also known as the Royal Danish army, was founded in 1614 in the wake of the Kalmar War. It was designed to maintain Denmark's sovereignty, prevent conflicts,boost Denmark's position as a great power and protect her foreign interests. By extending the draft of men for our army and sailors for our navy to our subjects, and not just Danes, we can encourage more to join ranks in the defense of Denmark."


 king_and_duke_reform: "Danish Bill of Rights"
 king_and_duke_reform_desc: "For most of its existence, Denmark has had large and numerous subjects. Due to this, the Danish monarchy has had to tend to the needs of their subjects to ensure comittment and loyalty. By drafting and promoting a Danish bill of rights that applies to all our subjects, they will see us as a benevolent protector, rather than a tyrant, because no other great power will respect their rights in the same as us and will seek to dominate them."
 mechanic_enable_king_and_duke_reform_yes: "'§YPersonal Unions§!' will receive §YDanish Bill of Rights§! granting: \nGoods Produced Modifier: §G+15.0%§! \nManpower In Primary Culture Provinces: §G+20.0%§!"
 BM_king_and_duke_subject_modifier: "Danish Bill of Rights"

 christian_four_merchantile_reform: "Christian's Mercantile Reforms"
 christian_four_merchantile_reform_desc: "To re-assert claims over Iceland and Greenland, as well as expand the reach of danish mercantile power, Christian IV instituted major mercantile reforms, increasing the sound toll, promoting northern exploration voyaged and granting monopolies and privileges to traders that sailed for the Orient."


 danske_besiddelser_reform: "Danske Besiddelser"
 danske_besiddelser_reform_desc: "Our possessions abroad are very important to our economy and we must focus on expanding and regulating them. By appointing governors to our colonies and granting more autonomy to merchants in trading regions, we can maximize revenues and minimize expenditure."
 mechanic_enable_danish_mercantilism_yes: "For every §G10.0%§! Mercantilism we get §G1.5%§! Trade Efficiency up to a maximum of §G15.0%§! Trade Efficiency."

 Home_Market_1: "Mercantilist Efficiency"
 Home_Market_2: "Mercantilist Efficiency"
 Home_Market_3: "Mercantilist Efficiency"
 Home_Market_4: "Mercantilist Efficiency"
 Home_Market_5: "Mercantilist Efficiency"
 Home_Market_6: "Mercantilist Efficiency"
 Home_Market_7: "Mercantilist Efficiency"
 Home_Market_8: "Mercantilist Efficiency"
 Home_Market_9: "Mercantilist Efficiency"
 Home_Market_10: "Mercantilist Efficiency"

 abolish_the_haandfaestning_reform: "Abolish the Haanfaestning"
 abolish_the_haandfaestning_reform_desc: "For centuries the Danish kings have had to accept limits to their power and often struggled over each and every issue with the nobility. My hands shall no longer be bound by such obstactles. My rule is my own and any noble or clergical influence shall no longer be accepted. My reign and my heirs are no longer submit to signing this humiliating document."










 #FLORENCE
 florentine_republic: "The Florentine Republic"
 florentine_republic_desc: "We normally think of a Republic as a government where everyone votes for representatives who will represent their interests to the government (think of the United States pledge of allegiance: "and to the republic for which it stands..."). However, Florence was a Republic in the sense that there was a constitution which limited the power of the nobility (as well as laborers) and ensured that no one person or group could have complete political control (so it was far from our ideal of everyone voting, in fact a very small percentage of the population had the vote). Political power resided in the hands of middle-class merchants, a few wealthy families (such as the Medici, important art patrons who would later rule Florence) and the powerful guilds."


