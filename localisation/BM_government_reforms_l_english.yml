 Cortes_Discipline: "Tougher Drills"
 Cortes_Piety: "Special Ceremonies"


 portugese_marines_reform: "Portugese Fuzileiros"
 portugese_marines_reform_desc: "Traditionally, whilst the army was levied and professionaly trained, the sailors were often forcefully drafted and put into service of the navy. But as Portugals establishes herself across the world, the need for better land-to-sea coordination is precient and highly skilled sailors become a must to crew our warships. By letting sailors undergo a formal military training it will not only help with providing us crews for our ship, it will also make our marines much more skilled."

 BM_portugese_marines_modifier: "Portugese 'Fuzileiros'"
 BM_portugese_marines_barracks_modifier: "'Fuzileiros' Barracks"
 BM_portugese_marines_training_fields_modifier: "'Fuzileiros' Training Fields"

 mechanic_enable_portugese_marines_yes: "Fuzileiros: §YBarracks§! and §YTraining Fields§! gives §G+25.0%§! / §G+50.0%§! Local Sailors Modifier"


 casa_de_india_reform: "Casa da India"
 casa_de_india_reform_desc: "Originally established to oversee the Iberian and Moroccan trade routes, the Casa da India now helps manage the west indies, the gold mines of africa, and the far eastern provinces, providing us with many profitable routes of trade."



 #SAVOY
 savoia_reform: "I Savoia"
 savoia_reform_desc: "At the career peka of Amedeo VIII 'the peaceful' in 1430, the Savoy domain had expanded its territories to encompass Romandie, across the alps into Piedmont and Nizza. Not only did Savoy boast an impressing geographical height, but also a tightly weaven diplomatic network capable of taming both the Kingdom of France and the Holy Roman Empire. To fully centralize the newly acquired territories a first body of general laws were enacted. With them came a uniform sanctioned for all the Savoy states."

 kingdom_of_sardinia_reform: "Union Perfetta"
 kingdom_of_sardinia_reform_desc: "The perfect fusion refers to the political and administrative union between the Kingdom of Sardinia and the mainland states owned by the Savoy, including Piedmont, the Duchy of Savoy, Nice, the fiefs of the Ligurian Apennines and the former Republic of Genoa. With this also came a similar Acts of Union that the British would come to enact as well."



 milizia_nationale_reform: "Milizia Nationale"
 milizia_nationale_reform_desc: "Who fights better? A foreigner fighting for his pockets, loyal only to his Condottiero Captain and however much money we can give him, or a soldier fighting for his prince, land and family! Let us rely on the strength of our own arms, our own sons and our own banners instead."




 #FRANCE
 blood_tax_reform: "Blood Tax"
 blood_tax_reform_desc: "The Nobility is not only the most important estate in France due to its power and influence, but also due to its responsibility to pay their dues to the King. But this tax is not payed in gold or goods, but in the form of soldiers and knights. By emphasising on this responsibility we can squeeze more manpower out of our subjects."
 mechanic_enables_blood_tax_yes: "Blood Tax: §YVassals§!, §YMarches§! and §YAppanages§! gain §G+25.0%§! Manpower Modifier and §G-15.0%§! Regiment Cost."
 BM_subject_blood_tax: "Blood Tax"


 noblesse_d_epee_reform: "Noblesse d'epee"
 noblesse_d_epee_reform_desc: "As with officer of the sword, the expression "noble of the sword" derives from the right of such noblemen to bear a sword, which reflected their duty of knightly service to their feudal overlord. In later centuries, a nobleman of the sword was not recognized as such unless his family had held this status for at least four generations. The Nobles of the Sword also provided non-military services to the king, holding positions in all branches of government."
 mechanic_enables_officers_of_the_sword_yes: "Officers of the Sword: §G+1§! Prestige if you have over 50 Army Tradition."
 BM_officers_of_the_sword: "Officers of the Sword"
 BM_officers_of_the_sword_desc: ""

 generalites_reform: "Generalites"
 generalites_reform_desc: "In an attempt to reform the old feudal system that had been deeply entrenched in French society, the 'Généralités' were created to divide France into new districts and regions. Their function helped France to further centralize its power at the hands of the state as well as allowed the 'receveurs royaux', the royal collectors, to more efficiently tax and manage the new districts."

 bourgeoisie_aristocracy_reform: "Bourgeoisie Aristocracy"
 bourgeoisie_aristocracy_reform_desc: "In the wake of the Hundred Years War and the great plague that followed, many noble estates fell into decline or died out, many others were pawned or sold to the rising bourgeoisie aristocracy, who are eager to expand their influence with noble titles rather then just with personal fortunes."
 mechanic_BM_french_buff_merchant_guild_financial_aid_yes: "The '§YBourgeoisie Financial Aid§!' Privilege will now also get §G+15.0%§! Provincial Trade Power Modifier."

 parisian_court_reform: "Parisian Court"
 parisian_court_reform_desc: "Let us fill our court with the best France has to offer; proper Parisians. For there is no more well-mannered and cultured than the elites of Paris. It is why ambassadors, heralds and diplomats all around Europe don't use their own language to communicate, but ours instead. It is a matter of prestige that we continue to capitalise on the 'Lingua Franca'."
 mechanic_enables_french_court_yes: "French Court: §G+1§! Prestige while you employ §Y3§! Francien Advisors."
 french_court: "French Court"
 desc_french_court: "[Root.GetBurghersName] Financial Demand now also grants: §G+15.0%§! Provincial Trade Power Modifier."

 society_of_agriculture_reform: "Society of Agriculture and Finances"
 society_of_agriculture_reform_desc: "The controller of finances has always been a unpopular position of government. Not only were your task enormous of single-handledly managing the French economy, but any alterations to fiscal or economic policy that wasn't supported by the States General or the King were forbidden. However, Henri Bertin managed to not only reverse France's steadily declining economy, but also radically reform several aspects. Issuing a decree permitting the circulation of grain, livestock and other rural goods without taxes, the export of grain, and the establishment of several 'zones' whose sole purpose was to grow food for the French people allowed France to regain its economic competitiveness in global trade whilst stimulating its local markets and feeding its people. All this laid the basis for the 'Society of Agriculture' and the 'Agricultural Committee' that would continue France's successful economic growth until the French Revolution."
 mechanic_enables_society_of_agriculture_yes: "Society of Agriculture: §G+2.0§! Trade Power and §G+40.0%§! Production Efficiency in §YGrain§! provinces. \n§G+25.0%§! Production Efficiency in §YLivestock§! and §YWine§! provinces."
 society_of_agriculture_grain: "Society of Agriculture"
 desc_society_of_agriculture_grain: ""
 society_of_agriculture_wine_livestock: "Society of Agriculture"
 desc_society_of_agriculture_wine_livestock: ""



 #CASTILLE / ARAGON / SPAIN
 kingdom_of_castille_and_leon: "Kingdom of Castille and Leon"
 kingdom_of_castille_and_leon_desc: "The Kingdom of Castille and Leon was a union between the two realms during the Reconquista. However, the kings and queens of Castille and Leon would often struggle to rein in the powerful nobles and militant orders that had laid the basis for the kingdom."
 mechanic_enable_militant_orders_yes: "Militant Orders: As long as we are in the §YAge of Discovery§! or §YAge of Reformation§! we will gain §G+25.0%§! Manpower Recovery Speed and §G+1.0§! Army Tradition while at war with §Yheretics§! or §Yheathens§!."

 jinetes_reform: "Crusader Orders"
 jinetes_reform_desc: "The Crusader Orders that formed during the times of the Reconquista has proven to be a powerful but very useful ally against the Muslims. Employing 'Jinetes', meaning genitour, a lightly armoured but highly mobile horseman, developed as a response to the mounted horse archers of the Moors, they have proven themselves an important role of our forces. By enobling some of them and granting them access to integrate into the nobility we can make sure we weaken the influence of our factionalist nobles whilst still gaining the manpower we desperately need."
 BM_militant_orders: "Militant Orders"
 BM_militant_orders_desc: ""



 #NAPLES / SICILY
 kingdom_of_sicily_reform: "Kingdom of Sicily"
 kingdom_of_sicily_reform_desc: "The traditions and laws of the Normans were used as the foundation for the Kingdom of Sicily, further strengthened under the German Hohenstaufen dynasty into a highly centralized monarchy. This has come at the cost of greatly alienating the nobles against us however."
 # Sicilian Kingdom Mechanic
 ## Mechanic
 ability_sicilian_kingdom_mechanic: "Sicilian Kingdom"
 sicilian_kingdom_adm_power: "Encourage City Living Progress"
