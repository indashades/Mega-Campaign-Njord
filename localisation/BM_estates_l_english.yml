 estate_nobles_muscovite_strong_duchies: "Boyar Principalities"
 estate_nobles_muscovite_strong_duchies_desc: "[Root.GetUsableNameCap] has since the fall of Kiev been decentralised due to the incursions of Tatar tributes and raids. In order to maximise the funds we can gather to pay tribute, our nation has granted the Boyars local Principalities in for regional and city effectiveness. This system has its benefits but makes maintaining the primacy of royal power a significant challenge."
 estate_nobles_muscovite_strong_duchies_TT: "If we have §G60.00%§! Boyars Loyalty we will also gain: \nAnnexation Relations Impact: §G-25.0%§!"

