 estate_burghers_promote_mercantilism_desc: "Mercantilism as an idea is growing in our country. We may choose to favor the faction backing this ideal and reap the benefits that comes from it ourselves."
 show_mercantile_bonuses: "This §YPrivilege§! will give bonuses based on our £mercantilism_text_icon£ §YMercantilism§!:\n\nAt least §M20.0%§! Mercantilism:\nCenter of Trade Upgrade Cost: §G-10.0%§!\n\nAt least §M40.0%§! Mercantilism:\nDevelopment Cost: §G-5.0%§!\n\nAt least §M60.0%§! Mercantilism:\nColonists: §G+1§!\n\nAt least §M80.0%§! Mercantilism:\nGoods Produced Modifier: §G+5.0%§!"

